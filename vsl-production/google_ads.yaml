# Credenciais removidas deste arquivo — use variaveis de ambiente.
# A biblioteca google-ads le automaticamente as env vars GOOGLE_ADS_* :
#   GOOGLE_ADS_DEVELOPER_TOKEN, GOOGLE_ADS_CLIENT_ID, GOOGLE_ADS_CLIENT_SECRET,
#   GOOGLE_ADS_REFRESH_TOKEN, GOOGLE_ADS_LOGIN_CUSTOMER_ID
# (use GoogleAdsClient.load_from_env() ou exporte as vars antes de rodar).
# Veja vsl-production/.env.example. NAO preencha valores reais neste arquivo tracked.
#
# developer_token: <GOOGLE_ADS_DEVELOPER_TOKEN>
# client_id: <GOOGLE_ADS_CLIENT_ID>
# client_secret: <GOOGLE_ADS_CLIENT_SECRET>
# refresh_token: <GOOGLE_ADS_REFRESH_TOKEN>
# login_customer_id: <GOOGLE_ADS_LOGIN_CUSTOMER_ID>
use_proto_plus: true
